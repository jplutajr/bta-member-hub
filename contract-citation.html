<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>BTA Contract Citation</title>
  <style>
    :root{--bg:#090909;--gold:#f2c230;--text:#f5f5f5;--muted:#bdbdbd}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
    .wrap{max-width:760px;margin:0 auto;padding:44px 18px;text-align:center}h1{font-size:clamp(22px,4vw,32px);margin:8px 0}
    .eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em}.sub{color:var(--muted);margin:8px 0 22px}
    .btn{display:inline-block;background:var(--gold);color:#111;font-weight:800;text-decoration:none;border-radius:8px;padding:10px 14px;margin:4px}
    .btn.secondary{background:#2a2a2a;color:#fff;border:1px solid #555}.error{background:#181818;border:1px solid #444;border-left:4px solid var(--gold);padding:16px;border-radius:8px;text-align:left}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Bridgehampton Teachers Association</div>
    <h1 id="heading">Opening original contract page...</h1>
    <div class="sub" id="status">Loading the cited page from the official signed 2025-2030 agreement.</div>
    <div id="fallback" hidden>
      <a class="btn" id="openPage" href="#" target="_self">Open cited contract page</a>
      <a class="btn secondary" href="./#contract">Back to Contract Center</a>
    </div>
  </main>

      const heading = document.getElementById('heading');

      const fallback = document.getElementById('fallback');
      const openPage = document.getElementById('openPage');

      if (!Number.isInteger(page) || !fileId) {
        heading.textContent = 'Invalid contract citation';
        status.innerHTML = '<div class="error">The requested signed-contract page could not be identified.</div>';
        fallback.hidden = false;
        openPage.hidden = true;
        return;
      }

      document.title = `BTA Contract - PDF Page ${page}`;
      heading.textContent = `Opening original PDF page ${page}`;
      status.textContent = 'This is the original page extracted directly from the signed 44-page agreement; no text or formatting has been recreated.';
      const target = `https://drive.google.com/file/d/${fileId}/preview`;
      openPage.href = target;
      fallback.hidden = false;

      window.setTimeout(() => location.replace(target), 120);
    })();
  </script>
</body>
</html>
