name: Sync Signed BTA Contract

on:
  push:
    paths:
      - ".github/workflows/sync-signed-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helpers
        run: python -m pip install --quiet gdown pypdf

      - name: Download official signed agreement
        run: |
          mkdir -p assets/contracts
          gdown --id "1lnoJ27j9RpkF0gTwzAdNUCjTH04ML0H-" \
            -O assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf

      - name: Validate PDF and regenerate AI source files
        run: python scripts/sync-signed-contract.py

      - name: Commit signed agreement and AI sources if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf \
            data/contract-text.txt \
            data/contract-numeric-reference.json
          git diff --cached --quiet || git commit -m "Use official signed agreement for contract assistant"
          git push
