name: Sync Signed BTA Contract

on:
  push:
    paths:
      - ".github/workflows/sync-signed-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google Drive downloader
        run: python -m pip install --quiet gdown

      - name: Download official signed agreement from Google Drive
        run: |
          mkdir -p assets/contracts
          gdown --id "1lnoJ27j9RpkF0gTwzAdNUCjTH04ML0H-" \
            -O assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf

      - name: Validate PDF
        run: |
          file assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf')
          data = p.read_bytes()
          assert data.startswith(b'%PDF-'), 'Downloaded file is not a PDF.'
          assert len(data) > 100000, 'Downloaded PDF is unexpectedly small.'
          print(f'Validated signed PDF: {len(data):,} bytes')
          PY

      - name: Commit signed agreement if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contracts/Bridgehampton_BTA_Agreement_2025-2030_Official_Signed.pdf
          git diff --cached --quiet || git commit -m "Add official signed 2025-2030 BTA agreement"
          git push
