name: Apply Signed BTA Contract Data

on:
  push:
    paths:
      - ".github/workflows/apply-signed-contract-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode signed contract AI sources
        run: python scripts/apply-signed-contract-data.py

      - name: Commit signed contract AI source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/contract-text.txt \
            data/contract-numeric-reference.json \
            backend/google-apps-script/Code.gs
          git diff --cached --quiet || git commit -m "Use signed agreement for contract assistant"
          git push
