name: Add Contract Citation Page Viewer

on:
  push:
    paths:
      - ".github/workflows/add-contract-citation-viewer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Contract Assistant citation links
        run: python scripts/patch-contract-citation-link.py

      - name: Commit citation viewer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/store-signed-contract.yml || true
          git rm -f .github/workflows/add-contract-citation-viewer.yml
          git rm -f scripts/patch-contract-citation-link.py
          git add assets/app.js index.html contract-citation.html
          git commit -m "Open Contract Assistant citations at exact signed pages"
          git push
