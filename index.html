<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTA Member Hub</title>
  <meta name="description" content="Bridgehampton Teachers Association — member news, events, salary schedules, contract tools, documents, and resources." />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Cache bust -->
  <link rel="stylesheet" href="assets/styles.css?v=FINAL15" />
  <link rel="stylesheet" href="assets/header-fixes.css?v=FINAL17" />
</head>
<body>
  <header>
    <div class="wrap top">
      <div class="brand">
        <img src="assets/logo.png" alt="Bridgehampton Teachers Association logo" style="height:40px;width:auto;" />
        <div>
          <h1>Bridgehampton Teachers Association</h1>
        </div>
      </div>

      <a class="mobileHomeBtn" href="#home" aria-label="Return to Home">Home</a>

      <button class="navToggle" id="navToggle" aria-label="Menu">
        <span class="bars">
          <span></span><span></span><span></span>
        </span>
      </button>

      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer>
    <div class="wrap">
      <div>© <span id="yr"></span> Bridgehampton Teachers Association.</div>
    </div>
  </footer>

  <script>
    document.getElementById("yr").textContent = new Date().getFullYear();
    if (!location.hash) location.hash = "#home";
  </script>

  <!-- Loads before app.js so Contract Assistant requests receive an anonymous browser ID. -->
  <script src="assets/contract-analytics.js?v=FINAL16"></script>
  <script src="assets/app.js?v=FINAL16"></script>
  <script>
    // Keep the two Home cards visually blank when there is nothing posted.
    // As soon as an event/update exists, app.js renders it normally.
    (() => {
      const cleanEmptyHomeCards = () => {
        if ((location.hash || "#home") !== "#home") return;
        document.querySelectorAll("#app .person").forEach((card) => {
          const heading = card.querySelector(".name");
          if (!heading) return;
          const title = heading.textContent.trim();
          if (title !== "Upcoming events" && title !== "Latest updates") return;

          const li = card.querySelector("ul li");
          const emptyText = title === "Upcoming events" ? "No events posted yet." : "No updates posted yet.";
          if (li && li.textContent.trim() === emptyText) {
            const ul = card.querySelector("ul");
            const linkRow = card.querySelector(".small");
            if (ul) ul.innerHTML = "";
            if (linkRow) linkRow.innerHTML = "";
          }
        });
      };

      const observer = new MutationObserver(cleanEmptyHomeCards);
      observer.observe(document.getElementById("app"), { childList: true, subtree: true });
      window.addEventListener("hashchange", cleanEmptyHomeCards);
      cleanEmptyHomeCards();
    })();
  </script>
</body>
</html>
